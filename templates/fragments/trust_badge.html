<div class="trust-badge-container flex items-center gap-3 p-4 rounded-lg bg-slate-900 border border-slate-800 my-4">
  <div class="flex flex-col">
    <span class="text-xs text-slate-400 uppercase font-semibold">Trust Tier</span>
    <span
      class="text-sm font-semibold {{ if eq .TrustTier `Human-Reviewed` }}text-emerald-400{{ else if eq .TrustTier `Machine-Confirmed` }}text-blue-400{{ else }}text-slate-400{{ end }}">
      {{ .TrustTier }}
    </span>
  </div>

  {{ if ne .TrustTier "Human-Reviewed" }}
  <button hx-post="/concept/verify?id={{ .ID }}" hx-target="closest .trust-badge-container" hx-swap="outerHTML"
    class="ml-auto text-xs px-3 py-1.5 rounded-md font-medium bg-cyan-600 hover:bg-cyan-500 text-white transition-colors cursor-pointer">
    Verify as Human
  </button>
  {{ end }}
</div>
